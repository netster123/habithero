<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HabitHero</title>
  <meta name="description" content="Rauchfrei, Sport, Essen und Schlaf – Schritt für Schritt zu neuen Gewohnheiten.">
  <meta name="theme-color" id="theme-color" content="#F7F6F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HabitHero">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Theme vor dem ersten Zeichnen setzen, damit nichts aufblitzt
    try {
      var s = JSON.parse(localStorage.getItem('habithero') || '{}').settings || {};
      var h = new Date().getHours();
      var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (s.darkAtNight !== false && h < 5) dark = true;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.getElementById('theme-color').content = dark ? '#1C1C1A' : '#F7F6F2';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="update-banner" class="banner" hidden>
    <span>Neue Version verfügbar</span>
    <button type="button" class="btn btn-small btn-primary" data-action="apply-update">Jetzt aktualisieren</button>
  </div>
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Bereiche"></nav>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>HabitHero braucht JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
